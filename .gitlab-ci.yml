image: python:3.13.5

stages:
- test
- build

# Test Job erstellen, der auf allen Branches läuft
run_all_tests:
  stage: test
  before_script:
    - pip3 install -r requirements.txt # damit alle Abhängigkeiten installiert sind
  script: # nach Vorlesungsinhalten
    - pytest --junitxml=report.xml
    - coverage run --source=src -m pytest
    - coverage report
    - coverage xml -o cov.xml
